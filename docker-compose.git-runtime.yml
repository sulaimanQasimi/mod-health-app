# Runtime git clone on server (alternative to build-time clone)
#
# 1. Set GIT_BRANCH in .env (optional)
# 2. docker compose -f docker-compose.yml -f docker-compose.git-runtime.yml up -d

services:
  app:
    build:
      target: production-base
    environment:
      GIT_REPO_URL: https://github.com/sulaimanQasimi/mod-health-app.git
      GIT_BRANCH: ${GIT_BRANCH:-main}
      RUN_COMPOSER_INSTALL: "true"
      RUN_NPM_BUILD: "true"
    volumes:
      - app_code:/var/www/html

  nginx:
    volumes:
      - app_code:/var/www/html:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro

  queue:
    environment:
      GIT_REPO_URL: https://github.com/sulaimanQasimi/mod-health-app.git
      GIT_BRANCH: ${GIT_BRANCH:-main}
    volumes:
      - app_code:/var/www/html

  scheduler:
    environment:
      GIT_REPO_URL: https://github.com/sulaimanQasimi/mod-health-app.git
      GIT_BRANCH: ${GIT_BRANCH:-main}
    volumes:
      - app_code:/var/www/html

volumes:
  app_code:
