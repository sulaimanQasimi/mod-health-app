# Optional: build from a specific branch or commit of the public repository
#
# docker compose -f docker-compose.yml -f docker-compose.git.yml build
# docker compose --env-file .env up -d

services:
  app:
    build:
      args:
        GIT_BRANCH: ${GIT_BRANCH:-main}
        GIT_REF: ${GIT_REF:-}

  queue:
    build:
      args:
        GIT_BRANCH: ${GIT_BRANCH:-main}
        GIT_REF: ${GIT_REF:-}

  scheduler:
    build:
      args:
        GIT_BRANCH: ${GIT_BRANCH:-main}
        GIT_REF: ${GIT_REF:-}
